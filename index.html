<body>
<div id="root"><p class="loading">Загружаю…</p></div>

<script>
  // Ловим ошибку в config.js, чтобы показать понятное сообщение, а не тихо работать без синхронизации
  window.__cfgError = null;
  window.addEventListener("error", function (e) {
    if (e && e.filename && /config\.js/.test(e.filename)) window.__cfgError = e.message || "ошибка в файле";
  }, true);
</script>
<script src="config.js"></script>
<script src="app.js"></script>
